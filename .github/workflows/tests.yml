name: Simulator, prototype and publication checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q sim scripts tests
      - name: Verify prototype provenance without external tools
        run: python scripts/run_prototype_validation.py --check

  rtl_and_prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install RTL simulation and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog yosys
      - name: Run RTL regression contract
        run: python -m unittest discover -s tests -p test_rtl_contract.py -v
      - name: Rebuild numerical, transport and RTL prototype evidence
        run: python scripts/run_prototype_validation.py --output-root generated/prototype-ci
      - name: Preserve current-run prototype evidence
        uses: actions/upload-artifact@v4
        with:
          name: prototype-validation
          path: generated/prototype-ci/

  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify committed publication provenance
        run: python scripts/rebuild_publication.py --check
      - name: Verify committed prototype provenance
        run: python scripts/run_prototype_validation.py --check
      - name: Verify committed paper provenance
        run: python scripts/build_paper.py --check
      - name: Install paper toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile revised paper and resolve references
        run: python scripts/build_paper.py
